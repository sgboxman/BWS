<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Media Gallery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        .audio-container {
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        audio {
            width: 100%;
            border-radius: 8px;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 700px;
            width: 100%;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            object-fit: cover;
        }

        @media (min-width: 600px) {
            .gallery {
                flex-direction: row;
            }
            .gallery img {
                width: 50%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Featured Photos & Audio</h1>
    </header>

    <div class="audio-container">
        <!-- Replace 'song.mp3' with your actual audio filename if different -->
        <audio controls autoplay>
            <source src="song.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <main class="gallery">
        <img src="meat1.jpeg" alt="Sliced smoked meat plate">
        <img src="meat2.jpeg" alt="Smoked meat sandwich cut in half">
    </main>

</body>
</html>
